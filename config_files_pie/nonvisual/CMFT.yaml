# Full CMFT for PIE: MFT + CLIP 5th stream + shared MLP alignment
model_opts:
  model: CMFT
  dataset: pie
  obs_input_type: ['behavior', 'bbox', 'vehicle_act', 'scene']
  apply_class_weights: True
  normalize_boxes: False
  generator: True

net_opts:
  num_hidden_units: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.1
  clip_features_dir: clip_embeddings
  use_clip: True
  use_shared_mlp: True

exp_opts:
  datasets: [pie]
  batch_size: [2]
  epochs: [30]
  lr: [2.0e-05]

data_opts:
  seq_type: nonvisual
