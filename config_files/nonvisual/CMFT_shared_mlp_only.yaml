# Ablation: MFT + shared MLP alignment on 4 streams (no CLIP)
model_opts:
  model: CMFT
  obs_input_type: ['behavior', 'bbox', 'vehicle_act', 'scene']
  apply_class_weights: True
  normalize_boxes: False
  generator: True
  dataset: jaad

net_opts:
  num_hidden_units: 128
  num_heads: 4
  num_layers: 2
  dropout: 0.1
  clip_features_dir: clip_embeddings
  use_clip: False
  use_shared_mlp: True

exp_opts:
  datasets: [jaad_beh, jaad_all]
  batch_size: [2, 2]
  epochs: [40, 40]
  lr: [5.0e-07, 5.0e-07]

data_opts:
  seq_type: nonvisual
